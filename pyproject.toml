[project]
name = "privatebench"
version = "0.1.0"
description = "Generating private benchmarks for cost-aware AI model selection and routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["privatebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
